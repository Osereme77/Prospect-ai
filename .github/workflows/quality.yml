name: quality

on:
  push:
    branches: [ui-test, main]
  pull_request:
    branches: [ui-test, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v3
      - run: supabase start
      - run: supabase db reset --local
      - run: supabase db lint --local --fail-on error
      - name: Run pgTAP database tests
        run: supabase test db --local 2>&1 | tee supabase-db-test.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: supabase-db-test-log
          path: supabase-db-test.log
          if-no-files-found: ignore
      - run: supabase stop
        if: always()
