<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="description" content="Remy Scout is your AI-powered assistant for discovering jobs, clients, and projects." />
    <meta property="og:title" content="Remy Scout — Find Better Opportunities" />
    <meta property="og:description" content="Discover jobs, freelance projects, potential clients, and business opportunities with assisted search and relevance scoring." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jobsremyai.netlify.app/" />
    <meta name="twitter:card" content="summary" />
    <title>Remy Scout — Find Better Opportunities</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('remy-scout-theme');
        const theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
